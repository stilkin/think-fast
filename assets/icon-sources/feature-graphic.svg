<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 500">
  <!-- Play Store feature graphic source (store-distribution spec): ink background,
       wordmark in Titan One (butter + coral !) at splash proportion (195.3 × 1024/1280),
       tagline in Fredoka 500 cream. Palette mirrors src/ui/theme.ts.
       Titan One central sits low — wordmark y nudged 5 up; Fredoka needs no nudge. -->
  <rect width="1024" height="500" fill="#241B4F" />
  <text
    x="512" y="210"
    font-family="TitanOne" font-size="156"
    text-anchor="middle" dominant-baseline="central"
    fill="#FFC53D"
  >Think Fast<tspan fill="#FF6B6B" dx="-11">!</tspan></text>
  <text
    x="512" y="350"
    font-family="Fredoka" font-size="46"
    text-anchor="middle" dominant-baseline="central"
    fill="#FFF6E7"
  >Spin the wheel, name it fast</text>
</svg>
