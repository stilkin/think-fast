# pnpm reads build-script approvals here. pnpm 10 blocks dependency install
# scripts by default and pnpm 11 fails the install outright (strictDepBuilds),
# which killed the first two EAS builds over simple-git-hooks' postinstall.
# `allowBuilds` is the setting both pnpm 10.26+ and 11 understand — the older
# onlyBuiltDependencies list was removed in pnpm 11.
allowBuilds:
  simple-git-hooks: true
